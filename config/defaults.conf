#!/usr/bin/env bash

###########################
# TANTO VPS DEFAULT CONFIG
###########################

# Project
TANTO_VERSION="1.0.0"


##########
# Cleanup
##########

JOURNAL_RETENTION="14d"
TEMP_RETENTION_DAYS="3"
DOCKER_RETENTION_DAYS="7"


#######
# Swap
#######

SWAP_SIZE_GB="2"
VM_SWAPPINESS="10"
VM_VFS_CACHE_PRESSURE="50"

###########
# Security
###########

SSH_PERMIT_ROOT_LOGIN="no"
SSH_PASSWORD_AUTHENTICATION="no"
SSH_X11_FORWARDING="no"


#########
# Docker
#########

DOCKER_LOG_MAX_SIZE="10m"
DOCKER_LOG_MAX_FILES="5"
DOCKER_LIVE_RESTORE="true"


########
# Nginx
########

NGINX_WORKER_CONNECTIONS="4096"
NGINX_KEEPALIVE_TIMEOUT="65"
NGINX_CLIENT_MAX_BODY_SIZE="100M"


###############
# Verification
###############

DISK_WARNING_THRESHOLD="80"
DISK_CRITICAL_THRESHOLD="90"

MEMORY_WARNING_THRESHOLD="20"
MEMORY_CRITICAL_THRESHOLD="10"

################
# Security
################

SSH_PERMIT_ROOT_LOGIN="no"
SSH_PASSWORD_AUTHENTICATION="no"
SSH_X11_FORWARDING="no"

FAIL2BAN_BANTIME="1h"
FAIL2BAN_FINDTIME="10m"
FAIL2BAN_MAXRETRY="5"
